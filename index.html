<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="An interactive map of AI sandbox providers and their public growth signals.">
  <title>Sandbox Sandbox</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jE28AAAAASUVORK5CYII=">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/toys.css">
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#atlas" data-view="atlas" class="wordmark" aria-current="page">Sandbox Sandbox</a>
      <nav aria-label="Main navigation">
        <a href="#updates" data-view="updates">Updates</a>
        <a href="#compare" data-view="compare">Compare</a>
        <a href="#method" data-view="method">Method</a>
      </nav>
      <div class="map-tools">
        <div class="map-search-wrap">
          <label class="search-box">
            <input id="map-search" type="search" autocomplete="off" placeholder="Find a provider…" aria-label="Find a provider" aria-keyshortcuts="/" aria-controls="search-results">
            <kbd aria-hidden="true">/</kbd>
          </label>
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </div>
    </div>
  </header>
  <main id="main" class="shell">
    <section id="atlas-view" aria-labelledby="atlas-title">
      <h1 id="atlas-title" class="sr-only">Sandbox map</h1>

      <div class="history-controls">
        <nav class="history-days" aria-label="Map history" id="history-days"></nav>
        <div class="history-jump">
          <label for="history-date">Date</label>
          <input type="date" id="history-date">
          <button type="button" id="jump-latest" class="latest-button" aria-label="Show latest map" disabled>Latest</button>
        </div>
      </div>

      <div class="board">
        <div id="stage" class="stage" aria-label="Interactive sandbox provider map" aria-description="Scroll or pinch to zoom. With the map focused, use the plus and minus keys to zoom, or zero to reset.">
          <canvas id="board-canvas" aria-hidden="true"></canvas>
          <div id="map-labels" class="map-labels"></div>
          <div id="marker-layer" class="marker-layer"></div>
          <div id="egg-layer" class="egg-layer"></div>
        </div>
        <div class="zoom-hint" id="zoom-hint" aria-hidden="true" hidden>
          <span class="zoom-hint-mouse">Scroll to zoom</span>
          <span class="zoom-hint-touch">Pinch to zoom</span>
        </div>
        <div id="map-popover" class="map-popover" hidden></div>
      </div>
      <aside id="egg-player" class="egg-player" aria-labelledby="egg-title" hidden>
        <header>
          <div>
            <h2 id="egg-title"></h2>
            <p id="egg-source"></p>
          </div>
          <button type="button" class="utility-button" id="egg-close" aria-label="Close clip">Close</button>
        </header>
        <div id="egg-media" class="egg-media"></div>
        <a id="egg-original" class="evidence-link" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
      </aside>
    </section>

    <section id="updates-view" class="updates-view" hidden aria-labelledby="updates-title">
      <header class="page-heading">
        <h1 id="updates-title">Updates</h1>
      </header>
      <div class="updates-controls">
        <div class="category-filter" role="group" aria-label="Provider category">
          <button type="button" data-category="all" class="active" aria-pressed="true">All providers</button>
          <button type="button" data-category="Sandboxes" aria-pressed="false">Sandboxes</button>
          <button type="button" data-category="Cloud platforms" aria-pressed="false">Cloud</button>
          <button type="button" data-category="Developer tools" aria-pressed="false">Dev tools</button>
        </div>
        <label class="select-wrap">
          <select id="kind-filter" aria-label="Filter updates by signal type">
            <option value="all">All signals</option>
            <option value="launch">Product launches</option>
            <option value="feature">Feature releases</option>
            <option value="funding">Funding</option>
            <option value="partnership">Partnerships</option>
            <option value="adoption">Adoption</option>
            <option value="retirement">Retirements</option>
          </select>
        </label>
      </div>
      <div id="updates-feed" class="updates-feed"></div>
    </section>

    <section id="compare-view" hidden aria-labelledby="compare-title">
      <header class="page-heading">
        <h1 id="compare-title">Compare providers</h1>
      </header>
      <div id="compare-tray"></div>
      <section class="directory" aria-label="Provider directory">
        <div class="directory-tools">
          <label class="search-box">
            <input id="directory-search" type="search" placeholder="Find a provider…" aria-label="Find a provider">
          </label>
          <label class="select-wrap">
            <select id="directory-category" aria-label="Provider category">
              <option value="all">All providers</option>
              <option value="Sandboxes">Sandboxes</option>
              <option value="Cloud platforms">Cloud platforms</option>
              <option value="Developer tools">Developer tools</option>
            </select>
          </label>
          <span id="directory-count" class="muted"></span>
        </div>
        <div id="directory-table" class="directory-table"></div>
      </section>
    </section>

    <section id="method-view" hidden aria-labelledby="method-title">
      <header class="page-heading">
        <h1 id="method-title">Methodology</h1>
      </header>
      <div id="method-content" class="method-grid"></div>
    </section>
  </main>
  <dialog id="profile" class="profile" aria-labelledby="profile-title"></dialog>
  <div id="announcements" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">Enable JavaScript to use the atlas.</p></noscript>
</body>
</html>
