<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="An interactive map of AI sandbox providers and their public growth signals.">
  <title>Sandbox Sandbox</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jE28AAAAASUVORK5CYII=">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/toys.css">
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="site-brand">
        <a href="#atlas" data-view="atlas" class="wordmark" aria-current="page">Sandbox Sandbox</a>
        <a class="redrouter-credit" href="https://redrouter.org/" target="_blank" rel="noopener">
          <img src="./assets/redrouter.svg" alt="" width="16" height="16">
          scraped using Red Router
        </a>
      </div>
      <nav aria-label="Main navigation">
        <a href="#updates" data-view="updates">Updates</a>
        <a href="#compare" data-view="compare">Compare</a>
        <a href="#method" data-view="method">Method</a>
      </nav>
      <div class="map-tools">
        <div class="map-search-wrap">
          <label class="search-box">
            <input id="map-search" type="search" autocomplete="off" placeholder="Find a provider…" aria-label="Find a provider" aria-keyshortcuts="/" aria-controls="search-results">
            <kbd aria-hidden="true">/</kbd>
          </label>
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="achievement-toggle" id="achievement-toggle" aria-label="Achievements" aria-expanded="false" aria-controls="achievements-panel">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 21h8m-4-6v6m-6-16H3v2a4 4 0 0 0 4 4m11-6h3v2a4 4 0 0 1-4 4M6 3h12v6a6 6 0 0 1-12 0z"/></svg>
        </button>
        <section class="achievement-panel" id="achievements-panel" aria-labelledby="achievements-title" hidden>
          <div class="achievement-heading">
            <h2 id="achievements-title">Achievements</h2>
            <span id="achievement-count"></span>
          </div>
          <ul id="achievement-list" class="achievement-list"></ul>
        </section>
        <a class="github-link" href="https://github.com/lorenjphillips/Sandbox-Sandbox" target="_blank" rel="noopener" aria-label="View Sandbox Sandbox on GitHub">
          <img src="./assets/github.svg" alt="" width="20" height="20">
        </a>
      </div>
    </div>
  </header>
  <main id="main" class="shell">
    <section id="atlas-view" aria-labelledby="atlas-title">
      <h1 id="atlas-title" class="sr-only">Sandbox map</h1>

      <div class="board">
        <div id="stage" class="stage" aria-label="Interactive sandbox provider map" aria-description="Drag to rotate and tilt around the center. Scroll or pinch to zoom. On touch, slide two fingers up or down to tilt. Slide sideways or diagonally to move when zoomed in. On a mouse, right-drag to move when zoomed in. When the map is focused, the arrow keys rotate and tilt, plus and minus zoom, and zero resets the view.">
          <canvas id="lawn-canvas" aria-hidden="true"></canvas>
          <canvas id="board-canvas" aria-hidden="true"></canvas>
          <div id="map-labels" class="map-labels"></div>
          <div id="marker-layer" class="marker-layer"></div>
          <div id="egg-layer" class="egg-layer"></div>
        </div>
        <button type="button" class="reset-camera" id="reset-camera" aria-keyshortcuts="0">Reset view</button>
        <div class="history-controls" role="group" aria-label="History playback">
          <button type="button" class="history-calendar-toggle" id="history-calendar-toggle" aria-label="Choose a start date" aria-expanded="false" aria-controls="history-calendar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M7.5 3.5v4m9-4v4m-13 2.5h17m-12 4h1m5 0h1m-7 3h1"/></svg>
          </button>
          <button type="button" id="history-play" class="history-play" aria-label="Play history from beginning">Play</button>
          <time class="history-clock" id="history-clock" hidden></time>
          <section class="history-calendar" id="history-calendar" aria-label="Choose a start date" hidden>
            <header class="history-calendar-head">
              <button type="button" data-calendar-month="-1" aria-label="Previous month"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 3.5-4.5 4.5 4.5 4.5"/></svg></button>
              <strong id="history-calendar-month" aria-live="polite"></strong>
              <button type="button" data-calendar-month="1" aria-label="Next month"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
            </header>
            <div class="history-calendar-week" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
            <div class="history-calendar-days" data-calendar-days role="group" aria-labelledby="history-calendar-month"></div>
            <footer class="history-calendar-footer"><button type="button" data-calendar-clear>From beginning</button></footer>
          </section>
        </div>
        <div class="zoom-hint" id="zoom-hint" aria-hidden="true" hidden>
          <span class="zoom-hint-mouse">Scroll to zoom</span>
          <span class="zoom-hint-touch">Pinch to zoom</span>
        </div>
        <span id="playback-tether" class="playback-tether" aria-hidden="true" hidden></span>
        <div id="map-popover" class="map-popover" hidden></div>
      </div>
      <aside id="egg-player" class="egg-player" aria-labelledby="egg-title" hidden>
        <header>
          <div>
            <h2 id="egg-title"></h2>
            <p id="egg-source"></p>
          </div>
          <button type="button" class="utility-button" id="egg-close" aria-label="Close clip">Close</button>
        </header>
        <div id="egg-media" class="egg-media"></div>
        <a id="egg-original" class="evidence-link" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
      </aside>
    </section>

    <section id="updates-view" class="updates-view" hidden aria-labelledby="updates-title">
      <header class="page-heading">
        <h1 id="updates-title">Updates</h1>
      </header>
      <div class="updates-controls">
        <div class="category-filter" role="group" aria-label="Provider category">
          <button type="button" data-category="all" class="active" aria-pressed="true">All providers</button>
          <button type="button" data-category="Sandboxes" aria-pressed="false">Sandboxes</button>
          <button type="button" data-category="Cloud platforms" aria-pressed="false">Cloud</button>
          <button type="button" data-category="Developer tools" aria-pressed="false">Dev tools</button>
        </div>
        <label class="select-wrap">
          <select id="kind-filter" aria-label="Filter updates by signal type">
            <option value="all">All signals</option>
            <option value="launch">Product launches</option>
            <option value="feature">Feature releases</option>
            <option value="funding">Funding</option>
            <option value="partnership">Partnerships</option>
            <option value="adoption">Adoption</option>
            <option value="retirement">Retirements</option>
          </select>
        </label>
      </div>
      <div id="updates-feed" class="updates-feed"></div>
    </section>

    <section id="compare-view" hidden aria-labelledby="compare-title">
      <header class="page-heading">
        <h1 id="compare-title">Compare providers</h1>
      </header>
      <div id="compare-tray"></div>
      <section class="directory" aria-label="Provider directory">
        <div class="directory-tools">
          <label class="search-box">
            <input id="directory-search" type="search" placeholder="Find a provider…" aria-label="Find a provider">
          </label>
          <label class="select-wrap">
            <select id="directory-category" aria-label="Provider category">
              <option value="all">All providers</option>
              <option value="Sandboxes">Sandboxes</option>
              <option value="Cloud platforms">Cloud platforms</option>
              <option value="Developer tools">Developer tools</option>
            </select>
          </label>
          <span id="directory-count" class="muted"></span>
        </div>
        <div id="directory-table" class="directory-table"></div>
      </section>
    </section>

    <section id="method-view" hidden aria-labelledby="method-title">
      <header class="page-heading">
        <h1 id="method-title">Methodology</h1>
      </header>
      <div id="method-content" class="method-grid"></div>
    </section>
  </main>
  <dialog id="profile" class="profile" aria-labelledby="profile-title"></dialog>
  <div id="announcements" class="sr-only" aria-live="polite"></div>
  <div id="achievement-announcement" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">Enable JavaScript to use the atlas.</p></noscript>
</body>
</html>
